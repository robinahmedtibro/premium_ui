[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premium_ui"
version = "0.1.0"
description = "A modern, premium SaaS-style interface for Frappe Framework and ERPNext v15"
authors = [
    { name = "Codenexora", email = "info@codenexora.xyz" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Frappe",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: User Interfaces"
]

[project.urls]
Homepage = "https://codenexora.xyz"
Repository = "https://github.com/robinahmedtibro/premium_ui"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["premium_ui*"]
namespaces = false

[tool.setuptools.package-data]
premium_ui = [
    "*.txt",
    "public/**/*",
    "api/**/*"
]
